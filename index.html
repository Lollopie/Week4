<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer src="index.js"></script>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="canvas-container">
        <div class="canvas">
            <div class="score">
                Score: 0
            </div>
            <div class="game-over game-card hidden">
                <h1>Game Over</h1>
                <p>Your score: <span class="final-score">0</span></p>
                <button class="restart-button">Play again</button>
            </div>

            <div class=" pause game-card hidden">
                <h1>Game is Paused</h1>
                <p>Press 'Esc' to resume</p>
            </div>
            <img src="public/background.jpg" class="background">
            <img src="public/cat_walking.png" class="player walking">
            <img src="public/cat_jumping.png" class="player jumping hidden">
        </div>
    </div>
</body>

</html>
